name: Docker

# 只验收不发布：镜像的版本号、edge 与 latest 由 release.yml 在 GitHub Release 成功后推送，
# edge 与 latest 始终指向最新发布的版本（ADR-0121）。
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, compose.yaml, 'src/**', 'migrations/**', 'web/**', 'resources/**', pyproject.toml, uv.lock, setup.py, MANIFEST.in, scripts/smoke_docker.py, .github/workflows/docker.yml]
  push:
    branches: [master]
    paths: [Dockerfile, .dockerignore, compose.yaml, 'src/**', 'migrations/**', 'web/**', 'resources/**', pyproject.toml, uv.lock, setup.py, MANIFEST.in, scripts/smoke_docker.py, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Linux ${{ matrix.arch }} 镜像验收
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@v4
      - name: 构建候选镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: longmeidao/peach:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: 验收临时容器
        run: python3 scripts/smoke_docker.py longmeidao/peach:test
      - name: 导出 NAS 真机验收镜像
        if: github.event_name == 'workflow_dispatch' && matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          image="peach-nas:candidate-${GITHUB_SHA:0:12}"
          docker tag longmeidao/peach:test "$image"
          docker image inspect "$image" > image-inspect.json
          docker image save "$image" | gzip > peach-nas-amd64.tar.gz
          sha256sum peach-nas-amd64.tar.gz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
      - name: 保存 NAS 真机验收产物
        if: github.event_name == 'workflow_dispatch' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: nas-candidate-${{ github.sha }}
          path: |
            peach-nas-amd64.tar.gz
            image-inspect.json
            SHA256SUMS
            SOURCE_COMMIT
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
