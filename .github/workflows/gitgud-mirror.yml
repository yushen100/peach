name: GitGud 备份

# GitGud 只保存代码与发布制品，不跑 CI：master 与版本标签推上来后原样推过去，推送带 ci.skip，不触发 GitGud 流水线。
# 版本发布后由 release.yml 按标签手动触发本工作流，让 GitGud 自己的 runner 把 GitHub Release 的制品存进包仓库并登记 Release；
# 旧版本也用手动触发补存。R2 只留最近三个版本，GitGud 保留全部已备份版本。
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要备份制品的版本标签，例如 v0.58.0
        required: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  GITGUD_PROJECT: https://gitgud.io/peach-mitao/peach

jobs:
  code:
    name: 推送代码
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 同一个 ref 排队推送：较早的运行后完成会被 GitGud 当成回退拒收。
    concurrency:
      group: gitgud-code-${{ inputs.tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 推送到 GitGud
        env:
          GITGUD_TOKEN: ${{ secrets.GITGUD_MIRROR_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$GITGUD_TOKEN" ] || { echo "缺少 secret GITGUD_MIRROR_TOKEN"; exit 1; }
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "标签格式不对：$TAG"; exit 1; }
            refspec="refs/tags/$TAG:refs/tags/$TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            refspec="$GITHUB_REF:$GITHUB_REF"
          else
            refspec="HEAD:$GITHUB_REF"
          fi
          auth="$(printf 'oauth2:%s' "$GITGUD_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # 不强推：GitGud 与 GitHub 分叉时停下来报错，交给人处理。
          git -c "http.$GITGUD_PROJECT.git/.extraheader=Authorization: Basic $auth" \
            push -o ci.skip "$GITGUD_PROJECT.git" "$refspec"

  release:
    name: 备份发布制品
    if: github.event_name == 'workflow_dispatch'
    needs: code
    runs-on: ubuntu-latest
    # 一个版本约 1.4 GB：GitGud 的 runner 从 GitHub 下载，再逐个上传并核对摘要。
    timeout-minutes: 90
    # 所有版本共用 GitGud 上的同一个配置分支，一次只备份一版。
    concurrency:
      group: gitgud-release
      cancel-in-progress: false
    env:
      GITGUD_TOKEN: ${{ secrets.GITGUD_MIRROR_TOKEN }}
      GITGUD_API: https://gitgud.io/api/v4/projects/peach-mitao%2Fpeach
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: 在 GitGud 的 runner 上转存制品并登记 Release
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "标签格式不对：$TAG"; exit 1; }
          # 从这里直接上传超过 100 MB 的文件会被 GitGud 前面的 Cloudflare 以 413 拒绝，所以交给 GitGud 自己的 runner。
          # 配置分支只含一个 .gitlab-ci.yml；固定提交时间，内容不变时提交也不变，推送就是空操作。
          blob="$(git hash-object -w .github/gitgud-backup.gitlab-ci.yml)"
          tree="$(printf '100644 blob %s\t.gitlab-ci.yml\n' "$blob" | git mktree)"
          commit="$(GIT_AUTHOR_NAME=peach GIT_AUTHOR_EMAIL=peach@users.noreply.github.com \
            GIT_COMMITTER_NAME=peach GIT_COMMITTER_EMAIL=peach@users.noreply.github.com \
            GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
            git commit-tree "$tree" -m "GitGud 制品备份流水线")"
          auth="$(printf 'oauth2:%s' "$GITGUD_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.$GITGUD_PROJECT.git/.extraheader=Authorization: Basic $auth" \
            push -f -o ci.skip "$GITGUD_PROJECT.git" "$commit:refs/heads/release-backup"
          body="$(jq -n --arg tag "$TAG" '{ref: "release-backup", variables: [{key: "PEACH_BACKUP_TAG", value: $tag}]}')"
          pipeline="$(curl -fsS -X POST -H "PRIVATE-TOKEN: $GITGUD_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "$GITGUD_API/pipeline")"
          id="$(jq -r .id <<<"$pipeline")"
          echo "GitGud 流水线：$(jq -r .web_url <<<"$pipeline")"
          while :; do
            sleep 30
            status="$(curl -fsS -H "PRIVATE-TOKEN: $GITGUD_TOKEN" "$GITGUD_API/pipelines/$id" | jq -r .status)"
            case "$status" in
              success) echo "$TAG 已备份到 GitGud"; break ;;
              failed|canceled|skipped) echo "GitGud 流水线结束于 $status"; exit 1 ;;
            esac
          done
